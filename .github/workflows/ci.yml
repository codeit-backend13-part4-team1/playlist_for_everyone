name: CI

on:
  pull_request:
    branches:
      - dev
      - main

  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Gradle Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Allow Gradle wrapper execution
        run: chmod +x gradlew

      - name: Build, test and verify line coverage
        run: ./gradlew build --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/test/
            build/test-results/test/
            build/reports/jacoco/test/
          if-no-files-found: warn

      - name: Generate line coverage badge
        run: |
          java .github/scripts/CoverageBadge.java \
            build/reports/jacoco/test/jacocoTestReport.xml \
            build/reports/jacoco/test/coverage.svg

      - name: Upload coverage badge
        uses: actions/upload-artifact@v7
        with:
          name: coverage-badge
          path: build/reports/jacoco/test/coverage.svg
          if-no-files-found: error
