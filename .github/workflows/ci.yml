name: CI/CD

on:
  pull_request:
    branches:
      - dev
      - main

  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Gradle Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Allow Gradle wrapper execution
        run: chmod +x gradlew

      - name: Build, test and verify line coverage
        run: ./gradlew build --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/test/
            build/test-results/test/
            build/reports/jacoco/test/
          if-no-files-found: warn

      - name: Generate line coverage badge
        run: |
          java .github/scripts/CoverageBadge.java \
            build/reports/jacoco/test/jacocoTestReport.xml \
            build/reports/jacoco/test/coverage.svg

      - name: Upload coverage badge
        uses: actions/upload-artifact@v7
        with:
          name: coverage-badge
          path: build/reports/jacoco/test/coverage.svg
          if-no-files-found: error

  push-image:
    name: Build and Push Image
    # main에 머지된 코드가 테스트를 통과했을 때만 실행한다.
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # OIDC 토큰은 이 job에서만 발급한다. PR의 build job은 AWS에 접근할 수 없다.
    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: ap-northeast-2
      ECR_REPOSITORY: playlist-for-everyone

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          # 출처 정보를 별도 항목으로 올리지 않아 푸시 1회에 이미지 1개만 남긴다.
          provenance: false
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to ECS
    # 이미지가 ECR에 올라간 뒤에만 실행한다
    needs: push-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: ap-northeast-2
      ECR_REPOSITORY: playlist-for-everyone
      ECS_CLUSTER: playlist-cluster
      ECS_SERVICE: playlist-service
      ECS_TASK_FAMILY: playlist-for-everyone
      CONTAINER_NAME: app

    steps:
      - name: Check commit is latest main
        # 예전 실행을 재실행해서 운영이 이전 커밋으로 돌아가는 것을 막는다.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          if [ "$latest_sha" != "$GITHUB_SHA" ]; then
            echo "::error::배포 대상($GITHUB_SHA)이 main 최신 커밋($latest_sha)이 아니라서 배포를 중단합니다."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 이미지 주소의 레지스트리 값을 얻기 위해 로그인
      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      # 환경 변수와 SSM 참조는 콘솔에서 관리한다. 최신 개정을 그대로 가져와 이미지만 교체한다.
      - name: Render task definition with new image
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@8d79160660ad39c402a16e5fc7cd2a32e8f7d6b7 # v1.9.1
        with:
          task-definition-family: ${{ env.ECS_TASK_FAMILY }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      # 새 개정을 등록하고 서비스에 적용한 뒤, 새 태스크가 정상 상태가 될 때까지 기다린다.
      - name: Deploy to ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@a00d4d57ac0de1a99b39fe469f3d898d38717c2b # v2.6.4
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true
          wait-for-minutes: 15
