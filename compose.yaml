services:
  postgres:
    image: 'postgres:16'
    environment:
      POSTGRES_DB: ${EVERYONE_DB_NAME:-everyone}
      POSTGRES_USER: ${EVERYONE_DB_USERNAME:-everyone}
      POSTGRES_PASSWORD: ${EVERYONE_DB_PASSWORD:-change-me}
    ports:
      - '${EVERYONE_DB_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${EVERYONE_DB_USERNAME:-everyone} -d ${EVERYONE_DB_NAME:-everyone}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: 'redis:7.4-alpine'
    ports:
      - '127.0.0.1:${EVERYONE_REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: 'docker.elastic.co/elasticsearch/elasticsearch:9.2.0'
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - '127.0.0.1:${EVERYONE_ELASTICSEARCH_PORT:-9200}:9200'
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
          test: ['CMD-SHELL', 'curl -fsS http://localhost:9200/_cluster/health || exit 1']
          interval: 10s
          timeout: 5s
          retries: 5
          start_period: 30s

volumes:
  postgres-data:
  elasticsearch-data: