spring:
  datasource:
    url: jdbc:postgresql://${EVERYONE_DB_HOST}:${EVERYONE_DB_PORT:5432}/${EVERYONE_DB_NAME}
    username: ${EVERYONE_DB_USERNAME}
    password: ${EVERYONE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${EVERYONE_JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: false
    show-sql: false
  flyway:
    enabled: ${EVERYONE_FLYWAY_ENABLED:true}
  docker:
    compose:
      enabled: false
  data:
    redis:
      host: ${EVERYONE_REDIS_HOST}
      port: ${EVERYONE_REDIS_PORT}

server:
  port: ${EVERYONE_SERVER_PORT:8080}

logging:
  level:
    root: info
    com.codeit.sb13.playlist_for_everyone: info

    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.batch: warn
    org.hibernate.orm.jdbc.bind: warn

everyone:
  openapi:
    server-url: ${EVERYONE_OPENAPI_SERVER_URL}
    server-description: 운영 배포 서버