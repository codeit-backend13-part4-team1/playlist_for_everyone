spring:
  config:
    import: optional:file:.env.dev[.properties]
  datasource:
    url: jdbc:postgresql://${EVERYONE_DB_HOST:localhost}:${EVERYONE_DB_PORT:5432}/${EVERYONE_DB_NAME:everyone}
    username: ${EVERYONE_DB_USERNAME:everyone}
    password: ${EVERYONE_DB_PASSWORD:change-me}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${EVERYONE_JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: ${EVERYONE_JPA_FORMAT_SQL:true}
    show-sql: ${EVERYONE_JPA_SHOW_SQL:false}
  flyway:
    enabled: ${EVERYONE_FLYWAY_ENABLED:true}
  docker:
    compose:
      enabled: ${EVERYONE_DOCKER_COMPOSE_ENABLED:true}
      arguments:
        - "--env-file"
        - ".env.dev"
  data:
    redis:
      host: ${EVERYONE_REDIS_HOST:localhost}
      port: ${EVERYONE_REDIS_PORT:6379}
  elasticsearch:
    uris: ${EVERYONE_ELASTICSEARCH_URIS:http://localhost:9200}

server:
  port: ${EVERYONE_SERVER_PORT:8080}

logging:
  level:
    root: info
    com.codeit.sb13.playlist_for_everyone: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.batch: trace
    org.hibernate.orm.jdbc.bind: off

everyone:
  websocket:
    # 미지정 시 로컬 서버의 Origin을 사용한다. 복수 주소는 쉼표로 구분하며 빈 값은 허용하지 않는다.
    allowed-origins: ${EVERYONE_WEBSOCKET_ALLOWED_ORIGINS:http://localhost:${server.port:8080}}

  openapi:
    server-url: http://localhost:${server.port:8080}
    server-description: 로컬 개발 서버

  jwt:
    # 로컬 개발 전용 공개 키. 운영 환경에서는 사용하지 않는다.
    secret-key: ${JWT_SECRET_KEY:bG9jYWwtZGV2LW9ubHkta2V5LTMyaXRlbS0wMDAwMDE=}
    refresh-cookie-secure: ${JWT_REFRESH_COOKIE_SECURE:false}

  oauth2:
    # 값이 없으면 임시값으로 서버는 기동하지만 소셜 로그인은 동작하지 않는다.
    # 소셜 로그인을 확인하려면 .env.dev에 실제 값을 넣는다.
    redirect-base-url: ${EVERYONE_OAUTH2_REDIRECT_BASE_URL:http://localhost:${server.port:8080}}
    google:
      client-id: ${EVERYONE_OAUTH2_GOOGLE_CLIENT_ID:local-google-client-id}
      client-secret: ${EVERYONE_OAUTH2_GOOGLE_CLIENT_SECRET:local-google-client-secret}
    kakao:
      client-id: ${EVERYONE_OAUTH2_KAKAO_CLIENT_ID:local-kakao-client-id}
      client-secret: ${EVERYONE_OAUTH2_KAKAO_CLIENT_SECRET:local-kakao-client-secret}

  sse:
    history:
      key-prefix: ${EVERYONE_SSE_HISTORY_KEY_PREFIX:everyone:dev:sse:history}
