spring:
  application:
    name: playlist_for_everyone

  profiles:
    default: dev
  jpa:
    open-in-view: false
    properties:
      hibernate:
        # 지연 로딩 시 배치 조회를 적용해 N+1 문제 완화
        default_batch_fetch_size: 100
        # 동일한 형태의 DML을 JDBC batch로 묶어 전송
        jdbc:
          batch_size: 50
        # 같은 SQL 템플릿의 insert/update를 최대한 연속 배치로 묶도록 정렬
        order_inserts: true
        order_updates: true
  servlet:
    multipart:
      # 파일 하나의 최대 크기
      max-file-size: ${EVERYONE_MULTIPART_MAX_FILE_SIZE:10MB}
      # 파일과 폼 데이터를 포함한 요청 전체의 최대 크기
      max-request-size: ${EVERYONE_MULTIPART_MAX_REQUEST_SIZE:12MB}

springdoc:
  api-docs:
    # OpenAPI 명세 제공 경로
    path: /v3/api-docs

  swagger-ui:
    # Swagger UI 설정
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

everyone:
  s3:
    bucket: ${EVERYONE_S3_BUCKET}
    region: ${EVERYONE_AWS_REGION}
    endpoint: ${EVERYONE_AWS_ENDPOINT}

  openapi:
    server-url: http://localhost:${server.port:8080}
    server-description: 로컬 개발 서버

  jwt:
    secret-key: ${JWT_SECRET_KEY}
    access-token-validity: ${JWT_ACCESS_TOKEN_VALIDITY:15m}
    # 기본값은 7일이며 환경 변수로 변경할 수 있다.
    refresh-token-validity: ${JWT_REFRESH_TOKEN_VALIDITY:7d}
  tmdb:
    base-url: https://api.themoviedb.org/3
    access-token: ${EVERYONE_TMDB_ACCESS_TOKEN}
    connect-timeout: 3s
    read-timeout: 10s