spring:
  datasource:
    url: jdbc:h2:mem:everyone-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false
    show-sql: false
  flyway:
    enabled: false
  docker:
    compose:
      enabled: false
  h2:
    console:
      enabled: false

logging:
  level:
    root: info
    com.codeit.sb13.playlist_for_everyone: debug

    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.batch: trace
    org.hibernate.orm.jdbc.bind: off

everyone:
  s3:
    bucket: everyone-test-backup
    region: ap-northeast-2
    endpoint:

  jwt:
    secret-key: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
    access-token-validity: 15m
    # 로컬 환경변수와 관계없이 테스트에서는 고정된 기간을 사용한다.
    refresh-token-validity: 7d

  admin:
    # 일반 통합 테스트에서 초기 관리자 계정을 생성하지 않는다.
    enabled: false


  tmdb:
    base-url: https://tmdb.test/3
    access-token: test-token

  sse:
    # 일반 테스트는 SSE 구독 없이 시작한다. Redis SSE 통합 테스트에서만 명시적으로 true로 덮어쓴다.
    subscription-enabled: false

